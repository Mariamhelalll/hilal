[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png logo.svg quran.json quran_en.json mushaf audio dist/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Firebase web apiKey is public by design (it only identifies the project).
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCDlvrO00PnFTtKsQcXrbHOLNgn0utYuf0"
