<style>
/* VOICE: girly, warm, sisterly; easy Egyptian-flavoured Arabic or friendly English
   IDEA: the Hijri moon; each day you fill your own crescent toward a full moon, month by month to Ramadan
   PICTURE: a large golden moon whose lit part grows with today's good deeds
   COLOUR and TYPE: burgundy dominant, blush support, moon gold accent; Fraunces + DM Sans (EN), Tajawal + Amiri (AR)
   LAYOUT: phone app shell, one column, language choice first, sticky bottom tab bar, six screens */
:root{color-scheme:light dark;
--bg:light-dark(#F7ECEA,#170C11);--card:light-dark(#FFFFFF,#24151C);--soft:light-dark(#F0DCD9,#2E1A23);
--ink:light-dark(#2B1219,#F6E8E6);--muted:light-dark(#6B4A52,#CDB3B8);--line:light-dark(#E6CFCB,#40262F);
--wine:light-dark(#7A1F3A,#E59AAE);--wineBg:light-dark(#7A1F3A,#5A1830);--gold:#D8B46A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:clip}
html[lang=ar] body{font-family:Tajawal,'DM Sans',sans-serif;font-size:17px}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 18px 116px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
html[lang=ar] :is(h1,h2,h3){font-family:Tajawal,sans-serif;font-weight:700}
h1{font-size:32px}h2{font-size:23px}h3{font-size:18px}
p{margin:0}ul{margin:0;padding-inline-start:20px}li{margin:4px 0}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl .ar{font-size:20px;color:var(--wine);font-weight:700}
.ttl h1+.ar{font-size:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 0 8px;gap:12px}
.logo{display:flex;align-items:baseline;gap:8px;font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--wine)}
.logo .ar{font-size:26px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.date{font-size:13px;color:var(--muted);text-align:end}
.date .ar{font-size:15px;color:var(--ink)}
.lang{min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--wine);background:transparent;color:var(--wine);font:600 13px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.intro{padding:6px 2px 4px;display:flex;flex-direction:column;gap:10px}
.intro .hi{font-family:Fraunces,serif;font-size:26px;font-weight:600;color:var(--wine)}
html[lang=ar] .intro .hi{font-family:Tajawal,sans-serif;font-weight:700}
.pillars a{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);color:var(--wine);text-decoration:none;font-weight:600;font-size:14px}
.hero{background:var(--wineBg);color:#FFF4F2;border-radius:28px;padding:22px 20px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:14px;align-items:center}
.hero p{color:#F4D7DC;font-size:15px}.hero h2{color:#fff}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rung{border-radius:14px;padding:10px 4px;text-align:center;background:var(--soft);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rung .ar{font-size:16px;color:var(--ink);font-weight:700}
.rung.now{background:var(--wineBg);color:#F4D7DC}.rung.now .ar{color:#fff}
.rung.done{opacity:.55}
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 2px;border:0;background:none;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--wine);display:grid;place-items:center}
.check[aria-pressed=true] .box{background:var(--wine)}
.check[aria-pressed=true] .box::after{content:"";width:7px;height:12px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed=true] .lbl{color:var(--muted)}
.lbl{display:flex;flex-direction:column;gap:1px}.lbl small{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--wine)}
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pr{min-height:70px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11px 'DM Sans',sans-serif}
.pr .ar{font-size:17px;font-weight:700}
.pr[aria-pressed=true]{background:var(--wineBg);color:#F4D7DC;border-color:var(--wineBg)}.pr[aria-pressed=true] .ar{color:#fff}
.tap{width:200px;height:200px;border-radius:50%;margin:4px auto;border:0;background:radial-gradient(circle at 35% 30%,#9B2F4F,#5A1830);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 18px 40px -18px #5A1830;transition:transform .08s;font:inherit}
.tap:active{transform:scale(.96)}
.tap span{font-family:Fraunces,serif;font-size:54px;line-height:1}
.dhikr{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.dhikr .ar{font-size:26px;line-height:1.8;color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine);border-radius:999px;transition:width .3s}
.btn{min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--wine);background:var(--wine);color:var(--card);font:600 15px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--wine)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 14px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],textarea{font:16px 'DM Sans',Tajawal,sans-serif;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.swb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swb[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.picked{display:flex;align-items:center;gap:12px}
.picked i{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sg{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px}
.sg i{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sg span{display:flex;flex-direction:column;font-size:14px;line-height:1.3}.sg small{color:var(--muted);font-size:12px}
.pal{border-radius:18px;overflow:hidden;background:var(--soft)}
.pal .strip{display:grid;height:56px}
.pal .meta{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.pal .meta small{color:var(--muted)}
.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1.5px dashed var(--wine);border-radius:16px;color:var(--wine);font-weight:600;cursor:pointer}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.lvl{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--soft);border:1.5px solid transparent;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.lvl b.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--wine);font-family:Fraunces,serif}
.lvl[aria-pressed=true]{border-color:var(--wine);background:var(--card)}
.lvl[aria-pressed=true] b.n{background:var(--wine);color:var(--card)}
.lvl .body{display:none;margin-top:6px;font-size:15px;color:var(--muted)}
.lvl[aria-pressed=true] .body{display:block}
.week{border-radius:18px;background:var(--soft);padding:12px 14px}
.week h4{margin:0 0 2px;font:600 15px 'DM Sans',Tajawal,sans-serif;color:var(--wine)}
.wk{border-radius:18px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:6px}
.wk .check{border-bottom:0;min-height:40px;padding:0}
.logo{align-items:center}
.mark{width:34px;height:34px;flex:none;border-radius:9px;box-shadow:0 6px 16px -8px #5A1830}
.mark.big{width:52px;height:52px;border-radius:13px}
.install{border:1.5px dashed var(--gold)}
.ramadan{background:linear-gradient(135deg,#232650,#3B3A78);color:#fff}
.ramadan .ttl h3{color:#fff}.ramadan .note{color:#C9C6EA}.ramadan .muted{color:#D9D6F2}
.ramrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ramn{font-family:Fraunces,serif;font-size:40px;line-height:1;color:var(--gold);font-weight:600}
html[lang=ar] .ramn{font-family:Tajawal,sans-serif;font-weight:700}
.soon{display:flex;flex-direction:column;gap:4px;background:#ffffff14;border:1px dashed var(--gold);border-radius:16px;padding:12px 14px;font-size:15px;color:#ECEAF8}
.soon b{color:var(--gold);font-size:13px}
.lk{display:flex;flex-direction:column;gap:10px}
.lkt{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.opt.sm{min-height:40px;padding:0 13px;font-size:13px}
.tryon{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:var(--soft);border-radius:20px;padding:12px}
.girlbox{background:radial-gradient(circle at 50% 40%,var(--card),transparent 70%);border-radius:16px}
.girl{width:100%;height:auto;display:block}
.tryb{border:1.5px solid transparent;cursor:pointer;font:inherit;color:inherit;text-align:start}
.sg.tryb[aria-pressed=true]{border-color:var(--wine);background:var(--card)}
.pal.tryb:hover{transform:translateY(-2px)}
@media(max-width:360px){.tryon{grid-template-columns:120px minmax(0,1fr)}}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:14px}
.stations span{background:var(--soft);border-radius:12px;padding:8px 10px}
.qcard{background:var(--wineBg);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.qcard p{font-size:19px;line-height:1.5;font-weight:500}
.qcard small{color:#F4D7DC}
.entry{border-radius:16px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:6px}
.entry .q{font-size:13px;color:var(--wine);font-weight:600}
.entry .t{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .del{align-self:flex-end;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;min-height:36px;text-decoration:underline}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;min-height:56px;justify-content:center;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:14px;line-height:1.2;text-align:center}
nav.tabs a .ar{font-size:13px}
html[lang=ar] nav.tabs a{font-size:13px;font-family:Tajawal,sans-serif}
nav.tabs a svg{width:21px;height:21px;margin-bottom:2px}
nav.tabs a[aria-current=page]{color:var(--wine);background:var(--soft)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ob{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 0%,#3B3A78 0%,#232650 45%,#141633 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.ob::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 10% 15%,#fff9,transparent),radial-gradient(1px 1px at 22% 62%,#fff8,transparent),radial-gradient(2px 2px at 35% 30%,#fffa,transparent),radial-gradient(1px 1px at 48% 85%,#fff7,transparent),radial-gradient(1.5px 1.5px at 62% 12%,#fff9,transparent),radial-gradient(1px 1px at 74% 48%,#fff8,transparent),radial-gradient(2px 2px at 86% 26%,#fffa,transparent),radial-gradient(1.5px 1.5px at 92% 78%,#fff8,transparent),radial-gradient(1px 1px at 6% 88%,#fff7,transparent);animation:twinkle 3.5s ease-in-out infinite alternate}
.ob[hidden],.ob .in[hidden]{display:none}
.ob .in{position:relative;max-width:400px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.ob h1{font-size:38px;color:#fff}.ob h1 .ar{font-size:34px;color:var(--gold)}
html[lang=ar] .ob h1{font-family:Tajawal,sans-serif}
.ob p{color:#D9D6F2}
.obmoon{filter:drop-shadow(0 0 28px #D8B46A66);animation:float 6s ease-in-out infinite}
.ob .choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ob .choose button,.obgo{min-height:56px;border-radius:999px;border:1.5px solid var(--gold);background:transparent;color:#fff;font:600 18px 'DM Sans',Tajawal,sans-serif;cursor:pointer;width:100%}
.ob .choose button.ar,.obgo{font-family:Tajawal,'DM Sans',sans-serif;background:var(--gold);color:#1B1F3B}
#obName{width:100%;min-height:56px;border-radius:18px;border:1.5px solid #6E6BA8;background:#ffffff14;color:#fff;font:500 19px 'DM Sans',Tajawal,sans-serif;text-align:center;padding:0 16px}
#obName::placeholder{color:#B7B4DA}
.oberr{color:#F6C9A0;min-height:1.2em;font-size:14px}
.obback{border:0;background:none;color:#B7B4DA;font:inherit;font-size:14px;cursor:pointer;min-height:40px;text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.namebtn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start;min-height:32px}
/* motion */
.rv{opacity:0;transform:translateY(34px) scale(.97);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.75,.2,1)}
.rv :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk){transition:opacity .55s ease,transform .55s cubic-bezier(.2,.75,.2,1)}
.rv:not(.in) :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk){opacity:0;transform:translateY(14px)}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(1){transition-delay:.15s}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(2){transition-delay:.22s}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(3){transition-delay:.29s}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(4){transition-delay:.36s}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(5){transition-delay:.43s}
.rv.in :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk):nth-child(n+6){transition-delay:.5s}
.rv.instant :is(.check,.pillars a,.pr,.week,.sg,.pal,.lvl,.wk){transition:none}
.girl :is(path,ellipse,rect,circle){transition:fill .6s ease}
.rv.in{opacity:1;transform:none}
.rv.instant{transition:none}
.rv .bar i{transition:width 1s cubic-bezier(.2,.75,.2,1) .25s}
.rv:not(.in) .bar i{width:0!important}
.rv.instant .bar i{transition:none}
.rung{transition:transform .5s ease,opacity .5s ease}
.rv:not(.in) .rung{opacity:0;transform:translateY(10px)}
.rv .rung:nth-child(2){transition-delay:.1s}.rv .rung:nth-child(3){transition-delay:.2s}.rv .rung:nth-child(4){transition-delay:.3s}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 22%,#fff8,transparent),radial-gradient(1.5px 1.5px at 38% 78%,#fff7,transparent),radial-gradient(2px 2px at 64% 18%,#fff9,transparent),radial-gradient(1.5px 1.5px at 84% 64%,#fff7,transparent),radial-gradient(1px 1px at 52% 46%,#fff8,transparent);animation:twinkle 4s ease-in-out infinite alternate}
.hero>*{position:relative}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.moonw{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.moonw .sh{transition:transform 1.2s cubic-bezier(.2,.75,.2,1)}
.moonw .glow{transition:opacity 1.2s ease}
.pop{animation:pop .35s ease}.pop .box{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.bump{animation:bump .25s ease}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- colour helpers ---------- */
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return rgb2hex([f(0)*255,f(8)*255,f(4)*255])}
const dist=(a,b)=>{const x=hex2rgb(a),y=hex2rgb(b);return Math.hypot(x[0]-y[0],(x[1]-y[1])*1.2,x[2]-y[2])};
const nearest=h=>NAMED.reduce((b,c)=>dist(h,c[2])<dist(h,b[2])?c:b,NAMED[0]);
const cname=h=>{const n=nearest(h);return A()?n[1]:n[0]};
const safeHex=h=>/^#[0-9a-f]{6}$/i.test(h)?h:'#1b1b1b';
function suggestions(base){
  const [h,s,l]=rgb2hsl(hex2rgb(base));let out;
  if(s<12)out=[['#7a1f3a',['A rich pop of colour','لمسة لون حلوة']],['#c19a6b',['Warm and soft','دافي وناعم']],['#e8c8c0',['Gentle contrast','تباين لطيف']],[l>50?'#1b1b1b':'#e9dcc3',['Clean and classic','كلاسيك ونضيف']]];
  else out=[[hsl2hex(h,s*.7,l>55?l-28:l+28),['Tonal, same family','من نفس العيلة']],[l>55?'#4a2c20':'#e9dcc3',['Neutral that always works','لون محايد بيمشي مع كل حاجة']],[hsl2hex(h+30,s*.8,l),['A neighbouring shade','درجة قريبة']],[hsl2hex(h+180,Math.min(s,45),Math.max(30,Math.min(70,l))),['Soft contrast','تباين هادي']]];
  const seen=new Set();return out.filter(x=>{const k=nearest(x[0])[0];return !seen.has(k)&&seen.add(k)});
}
let tryOn=null,tryPrev=null;
function defaultLook(base){const [,,l]=rgb2hsl(hex2rgb(base));return{h:suggestions(base)[0][0],t:base,b:l>60?'#3b3b3b':(l<30?'#d9c4a5':'#1b1b1b'),g:'#c19a6b'}}

let moonPrev=0;
function moonSVG(f){
  const r=50,cx=60,cy=60;

  <circle class="glow" cx="${cx}" cy="${cy}" r="${r+6}" fill="#D8B46A" opacity="${.08+.22*moonPrev}"/>
  <g clip-path="url(#mc)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#mg)"/><circle class="sh" cx="${cx}" cy="${cy}" r="${r}" fill="#3E1022" style="transform:translateX(${moonPrev>=1?130:2*r*moonPrev}px)"/></g>

/* ---------- reveal ---------- */
const RV='.intro,.hero,.card,.qcard';
const io='IntersectionObserver' in window?new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}},{threshold:.1,rootMargin:'0px 0px -30px 0px'}):null;
function reveal(el,fresh){
  const items=[...el.querySelectorAll(RV)];
  items.forEach((x,i)=>{x.classList.add('rv');
    if(!fresh){x.classList.add('in','instant');return}
    x.classList.remove('in','instant');x.style.transitionDelay=Math.min(i,4)*80+'ms';
    if(io)io.observe(x);else x.classList.add('in')});
}
function setView(id,html){
  const el=$(id),fresh=!el.classList.contains('on')||!el._shown;
  el.innerHTML=html;reveal(el,fresh&&el.classList.contains('on'));
  if(!el.classList.contains('on'))el._shown=false;
  if(id==='v-today')animateMoon();
}
function resetMoon(el){const sh=el.querySelector('.sh');if(sh){sh.style.transition='none';sh.style.transform='translateX(0px)';void sh.getBoundingClientRect();sh.style.transition=''}}
function replay(){const id=curView(),el=$('v-'+id);el._shown=true;reveal(el,true);if(id==='today'){moonPrev=0;resetMoon(el);animateMoon()}}
function animateMoon(){
  const sv=document.querySelector('#v-today .moonw');if(!sv)return;
  const f=+sv.dataset.f;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const sh=sv.querySelector('.sh'),gl=sv.querySelector('.glow');if(sh)sh.style.transform=`translateX(${f>=1?130:100*f}px)`;if(gl)gl.setAttribute('opacity',.08+.22*f);moonPrev=f}));
}

function onPhoto(e){

  const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{
    const cx=$('cv').getContext('2d');cx.drawImage(img,0,0,80,80);
    const px=cx.getImageData(28,24,24,48).data;const bk={};
    for(let i=0;i<px.length;i+=4){const k=[px[i]>>4,px[i+1]>>4,px[i+2]>>4].join(',');bk[k]=(bk[k]||0)+1}
    const top=Object.entries(bk).sort((a,b)=>b[1]-a[1])[0][0].split(',').map(v=>v*16+8);
    S.colour=rgb2hex(top);pf='all';genPal=genCombo();
    photoMsg=L([`We found ${cname(S.colour).toLowerCase()} as your main colour and made a combo for you. Tap a swatch if we got it wrong.`,`لقينا إن لونك الأساسي ${cname(S.colour)} وعملنالك تنسيق. لو غلطنا دوسي على اللون الصح.`]);
    URL.revokeObjectURL(url);renderStyle();save();
  };
  img.onerror=()=>{photoMsg=L(['That photo could not be read. Try another, or tap a colour below.','مقدرناش نقرا الصورة دي. جربي واحدة تانية، أو دوسي على لون.']);renderStyle()};
  img.src=url;
}

   <ul>${[['Sports or jersey hijab that tucks in, so nothing shifts when you move','طرحة سبور أو جيرسيه بتدخل كويس عشان متتحركش'],['Long, loose long-sleeve top, ideally past the hips','بلوزة واسعة بكم طويل، ويا ريت نازلة تحت الوسط'],['Wide-leg joggers or loose training trousers','بنطلون رياضي واسع'],['Supportive trainers you can walk and lift in','كوتشي مريح تمشي وترفعي بيه']].map(x=>`<li>${L(x)}</li>`).join('')}</ul></div>`);
}

function renderJournal(){
  const q=JT[jT][1][jQ];
  const entries=Array.isArray(S.journal)?S.journal:[];
  setView('v-journal',`
  <div style="margin-top:8px">${ttl(['Journal','يومياتي'],'h1')}</div>
  <p class="muted" style="margin-top:6px">${L(['Writing helps you understand your heart, your patterns and your blessings. Think of it as gentle muhasaba: a few honest minutes with yourself.','الكتابة بتخليكي تفهمي قلبك وعاداتك ونعم ربنا عليكي. اعتبريها محاسبة نفس بس بهدوء: كام دقيقة صادقة مع نفسك.'])}</p>
  <div class="card">
   <div class="row">${JT.map((t,i)=>`<button class="opt" type="button" data-jt="${i}" aria-pressed="${i===jT}">${L(t[0])}</button>`).join('')}</div>
   <div class="qcard"><small>${L(JT[jT][0])} · ${N(jQ+1)} / ${N(5)}</small><p>${L(q)}</p></div>
   <div class="row"><button class="btn ghost" id="jNext" type="button">${L(['Another question','سؤال تاني'])}</button></div>
   <label for="jText" class="note">${L(['Your answer','إجابتك'])}</label>
   <textarea id="jText" placeholder="${L(['Write freely. Nobody else will read this.','اكتبي براحتك. محدش هيقرا ده غيرك.'])}">${esc(jDraft)}</textarea>
   <button class="btn" id="jSave" type="button">${L(['Save','احفظي'])}</button>
   ${jT===4?`<p class="note">${L(["If things feel too heavy, please talk to someone you trust or a professional. You don't have to carry it alone.",'لو الدنيا تقيلة أوي، اتكلمي مع حد بتثقي فيه أو مع متخصص. مش لازم تشيلي ده لوحدك.'])}</p>`:''}
  </div>
  <div class="card">${ttl(['Your entries','كتاباتك'])}
   <div id="jList" style="display:flex;flex-direction:column;gap:10px"></div>
   <p class="note">${L(['Your journal is private to you.','يومياتك ليكي انتي بس.'])}</p></div>`);
  const list=$('jList');
  if(!entries.length){list.innerHTML=`<p class="note">${L(['No entries yet. Your first one is waiting.','لسه مفيش كتابات. أول واحدة مستنياكي.'])}</p>`}
  else entries.slice().reverse().forEach((en,ri)=>{
    const idx=entries.length-1-ri;const qq=(JT[en.th]&&JT[en.th][1][en.q])||['',''];
    const box=document.createElement('div');box.className='entry';
    const dt=document.createElement('span');dt.className='note';
    try{dt.textContent=new Date(String(en.d)+'T12:00:00').toLocaleDateString(A()?'ar-EG':'en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){dt.textContent=String(en.d)}
    const qe=document.createElement('span');qe.className='q';qe.textContent=L(qq);
    const te=document.createElement('p');te.className='t';te.textContent=String(en.t||'');
    const del=document.createElement('button');del.className='del';del.type='button';del.dataset.jdel=idx;del.textContent=L(['Delete','امسحي']);
    box.append(dt,qe,te,del);list.append(box);
  });
  $('jText').addEventListener('input',e=>{jDraft=e.target.value});
  $('jNext').addEventListener('click',()=>{jQ=(jQ+1)%5;renderJournal()});
  $('jSave').addEventListener('click',()=>{
    const t=jDraft.trim();if(!t)return;
    if(!Array.isArray(S.journal))S.journal=[];
    S.journal.push({d:tk,th:jT,q:jQ,t:t.slice(0,4000)});if(S.journal.length>300)S.journal=S.journal.slice(-300);
    day().journal=true;jDraft='';renderJournal();renderToday();save();
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const ds=b.dataset;let changed=true;
  if(ds.lang){S.lang=ds.lang;applyLang();showName()}
  else if(b.id==='nameBtn'){showName(true)}
  else if(b.id==='installBtn'){if(installEvt){installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;renderToday()}).catch(()=>{})}changed=false}
  else if(b.id==='installHide'){S.installHide=true;renderToday()}
  else if(b.id==='obGo'){submitName()}
  else if(b.id==='obBack'){if(S.name){$('ob').hidden=true;replay()}else{$('ob2').hidden=true;$('ob1').hidden=false}changed=false}
  else if(b.id==='langBtn'){S.lang=A()?'en':'ar';applyLang()}
  else if(ds.p!==undefined){const d=day();d.p[+ds.p]=!d.p[+ds.p];renderToday();if(curView()==='deen')renderDeen()}
  else if(ds.t){const d=day();d[ds.t]=!d[ds.t];renderToday()}
  else if(ds.go){location.hash=ds.go;changed=false}
  else if(ds.js!==undefined){const j=journey(),k=jKey(j);if(!Array.isArray(j.done[k]))j.done[k]=[];j.done[k][+ds.js]=!j.done[k][+ds.js];
    if(STG[j.stage]&&STG[j.stage][3].every((_,i)=>j.done[k][i])){j.stage++;renderToday();replay()}else renderToday()}
  else if(b.id==='newMoon'){const j=journey();j.cycle++;j.stage=0;renderToday();replay()}
  else if(ds.c!==undefined){const a=S.challenge[chKey]=Array.isArray(S.challenge[chKey])?S.challenge[chKey]:[];a[+ds.c]=!a[+ds.c];renderToday()}
  else if(ds.set){dSet=ds.set;dIdx=dSet==='g'?dayDh:0;renderDeen();changed=false}
  else if(b.id==='tap'){const d=day(),k=dSet+'-'+dIdx;d.dh[k]=(d.dh[k]||0)+1;updateTap();if(dSet==='g'&&dIdx===dayDh)renderToday()}
  else if(b.id==='dhReset'){day().dh[dSet+'-'+dIdx]=0;updateTap();renderToday()}
  else if(b.id==='dhNext'){const n=SETS[dSet][1].length;dIdx=(dIdx+1)%n;updateTap();changed=false}
  else if(b.id==='dhPrev'){const n=SETS[dSet][1].length;dIdx=(dIdx+n-1)%n;updateTap();changed=false}
  else if(ds.hf){hf=ds.hf;for(const x of document.querySelectorAll('[data-hf]'))x.setAttribute('aria-pressed',x.dataset.hf===hf);renderSurahs();changed=false}
  else if(ds.s){S.surahs[ds.s]=!S.surahs[ds.s];renderSurahs()}
  else if(ds.col){S.colour=ds.col;genPal=null;photoMsg='';renderStyle()}
  else if(ds.pf){pf=ds.pf;genPal=null;renderStyle();changed=false}
  else if(ds.f){fCur=ds.f;renderStyle();changed=false}
  else if(ds.bl){S.budget=+ds.bl;renderStyle()}
  else if(ds.cp){S.cap=ds.cp;renderStyle()}
  else if(ds.lk){const [kk,vv]=ds.lk.split(':');const k=lookState();k[kk]=kk==='skin'?+vv:vv;for(const x of document.querySelectorAll('[data-lk^="'+kk+':"]'))x.setAttribute('aria-pressed',x.dataset.lk===ds.lk);redrawGirl()}
  else if(ds.acc){const k=lookState();k.acc[ds.acc]=!k.acc[ds.acc];if(ds.acc==='tote'&&k.acc.tote)k.acc.cross=false;if(ds.acc==='cross'&&k.acc.cross)k.acc.tote=false;for(const x of document.querySelectorAll('[data-acc]'))x.setAttribute('aria-pressed',!!k.acc[x.dataset.acc]);redrawGirl()}
  else if(ds.th){tryOn=Object.assign({},tryOn,{h:ds.th});for(const x of document.querySelectorAll('[data-th]'))x.setAttribute('aria-pressed',x.dataset.th===ds.th);paintGirl(tryOn);changed=false}
  else if(ds.tp){const c=ds.tp.split(',').filter(x=>/^#[0-9a-f]{6}$/i.test(x));if(c.length>=4){tryOn=Object.assign({},tryOn,{h:c[0],t:c[1],b:c[2],g:c[3]});paintGirl(tryOn);const g=document.querySelector('.tryon');if(g&&g.scrollIntoView)g.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}changed=false}
  else if(ds.cown){if(!S.capOwn||typeof S.capOwn!=='object')S.capOwn={};S.capOwn[ds.cown]=!S.capOwn[ds.cown];renderStyle()}
  else if(ds.pa){S.passion=ds.pa;renderDrive()}
  else if(ds.ds){if(!S.drive[S.passion]||typeof S.drive[S.passion]!=='object')S.drive[S.passion]={};const o=S.drive[S.passion];o[ds.ds]=!o[ds.ds];renderDrive()}
  else if(ds.lv){S.level=ds.lv;renderHealth()}
  else if(ds.wk){S.wk[ds.wk]=!S.wk[ds.wk];renderHealth()}
  else if(ds.jt!==undefined){jT=+ds.jt;jQ=0;renderJournal();changed=false}
  else if(ds.jdel!==undefined){if(Array.isArray(S.journal)){S.journal.splice(+ds.jdel,1);renderJournal()}}
  else changed=false;
  if(changed)save();
  const at=[...b.attributes].find(a=>a.name.startsWith('data-')&&a.name!=='data-go');
  if(at&&window.CSS&&CSS.escape){const nb=document.querySelector(`[${at.name}="${CSS.escape(at.value)}"]`);if(nb){nb.classList.remove('pop');void nb.offsetWidth;nb.classList.add('pop')}}
  if(b.id==='tap'){const n=$('tapN');n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump')}
});

const MARK=`<svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><radialGradient id="lg1" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#F6E2B0"/><stop offset="1" stop-color="#C99A4A"/></radialGradient><mask id="lm1"><rect width="512" height="512" fill="#fff"/><circle cx="318" cy="214" r="132" fill="#000"/></mask><linearGradient id="lb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E2846"/><stop offset="1" stop-color="#5A1830"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lb1)"/><circle cx="246" cy="266" r="150" fill="url(#lg1)" mask="url(#lm1)"/><circle cx="352" cy="150" r="10" fill="#F6E2B0"/><circle cx="390" cy="210" r="6" fill="#F6E2B0" opacity=".8"/></svg>`;
/* ---------- install as app ---------- */
let installEvt=null;
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const framed=()=>{try{return window.self!==window.top}catch(e){return true}};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent||'')||(/Macintosh/.test(navigator.userAgent||'')&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(curView()==='today')renderToday()});
window.addEventListener('appinstalled',()=>{installEvt=null;S.installDone=true;save();renderToday()});
function installHTML(){
  if(standalone()||framed()||S.installDone||S.installHide)return '';
  const how=installEvt?`<button class="btn" type="button" id="installBtn">${L(['Add to home screen','ضيفيه على الشاشة الرئيسية'])}</button>`
   :isIOS?`<p class="muted">${L(['In Safari, tap the Share button (on iPad it is at the top), then "Add to Home Screen".','في Safari دوسي على زرار المشاركة (في الآيباد بيبقى فوق)، وبعدين "Add to Home Screen".'])}</p>`
   :`<p class="muted">${L(['Open your browser menu and tap "Add to Home screen" or "Install app".','افتحي قايمة المتصفح ودوسي على "Add to Home screen" أو "Install app".'])}</p>`;
  return `<div class="card install"><div style="display:flex;gap:12px;align-items:center">${MARK.replace('class="mark"','class="mark big"')}<div><h3>${L(['Keep Hilal on your phone','خلّي هلال على موبايلك'])}</h3><p class="note">${L(['It opens like an app, full screen, even with weak internet.','بيفتح زي الأبلكيشن، فول سكرين، وحتى لو النت ضعيف.'])}</p></div></div>${how}<button class="namebtn" type="button" id="installHide">${L(['Not now','مش دلوقتي'])}</button></div>`;
}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!framed()){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* ---------- welcome ---------- */
function showName(edit){
  $('ob').hidden=false;$('ob1').hidden=true;$('ob2').hidden=false;
  $('ob2t').textContent=edit?L(['Change your name','غيّري اسمك']):L(['Welcome to Hilal','أهلاً بيكي في هلال']);
  $('ob2p').textContent=L(['What should we call you?','نناديكي بإيه؟']);
  $('ob2l').textContent=L(['Your name','اسمك']);
  $('obName').placeholder=L(['Your name','اسمك']);$('obName').value=S.name||'';
  $('obGo').textContent=edit?L(['Save','احفظي']):L(["Let's start",'يلا نبدأ']);
  $('obBack').textContent=edit?L(['Cancel','إلغاء']):L(['Change language','غيّري اللغة']);
  $('obErr').textContent='';
  setTimeout(()=>{try{$('obName').focus()}catch(e){}},50);
}
function submitName(){
  const n=$('obName').value.replace(/\s+/g,' ').trim().slice(0,30);
  if(!n){$('obErr').textContent=L(['Write your name first','اكتبي اسمك الأول']);return}
  S.name=n;$('ob').hidden=true;renderToday();replay();save();
}
$('obName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitName()}});

/* ---------- tabs + language ---------- */
const ICON={today:'<circle cx="12" cy="12" r="8"/><path d="M15 6a7 7 0 1 0 0 12 6 6 0 0 1 0-12z" fill="currentColor"/>',deen:'<path d="M4 19V8l8-4 8 4v11"/><path d="M4 19h16M12 4v3"/>',style:'<path d="M9 4l3 2 3-2 5 3-2 4-3-1v10H9V10l-3 1-2-4z"/>',drive:'<path d="M5 19 19 5M9 5h10v10"/>',health:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',journal:'<path d="M6 4h11a1 1 0 0 1 1 1v15H7a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h4"/>'};
const curView=()=>{const h=(location.hash||'#today').slice(1);return TABS.some(t=>t[0]===h)?h:'today'};
function route(){
  const v=curView();
  for(const t of TABS){const el=$('v-'+t[0]),on=t[0]===v;const was=el.classList.contains('on');el.classList.toggle('on',on);if(on&&!was){el._shown=true;reveal(el,true);if(t[0]==='today'){moonPrev=0;resetMoon(el);animateMoon()}}}
  for(const a of document.querySelectorAll('[data-tab]')){if(a.dataset.tab===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function applyLang(){
  const ar=A();document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
  $('langBtn').textContent=ar?'English':'عربي';
  $('logo').innerHTML=MARK+(ar?'<span class="ar" style="font-size:30px">هلال</span>':'<span>Hilal</span>');
  $('dateLine').innerHTML=(H?(ar?`<span class="ar">${toAr(H.d)} ${MAR[H.m-1]} ${toAr(H.y)}</span><br>`:`${H.d} ${MEN[H.m-1]} ${H.y} AH<br>`):'')+today.toLocaleDateString(ar?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  document.title=ar?'هلال':'Hilal';
  $('tabs').innerHTML=TABS.map(t=>`<a href="#${t[0]}" data-tab="${t[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[t[0]]}</svg>${ar?t[1][1]:t[1][0]}</a>`).join('');
  $('saveNote').textContent=ref?L(['Progress saved to your account.','تقدّمك محفوظ في حسابك.']):L(['Your progress is kept while this page is open.','تقدّمك محفوظ طول ما الصفحة مفتوحة.']);
  renderAll();route();replay();
}
function renderAll(){renderToday();renderDeen();renderStyle();renderDrive();renderHealth();renderJournal()}

/* ---------- saving ---------- */
let ref=null,timer=null;
function save(){
  try{localStorage.setItem('hilal',JSON.stringify(S))}catch(e){}
  if(!ref)return;clearTimeout(timer);
  timer=setTimeout(()=>{ref.set(S).then(()=>{$('saveNote').textContent=L(['Progress saved to your account.','تقدّمك محفوظ في حسابك.'])}).catch(()=>{$('saveNote').textContent=L(['Could not save just now. Your progress is still here on this page.','مقدرناش نحفظ دلوقتي، بس تقدّمك لسه هنا.'])})},700);
}
function merge(x){
  if(!x||typeof x!=='object')return;
  S=Object.assign(S,x);S.colour=safeHex(S.colour);
  if(S.surahs&&typeof S.surahs==='object'){for(const k of Object.keys(S.surahs)){if(!/^\d+$/.test(k)){const norm=k.toLowerCase().replace(/[^a-z]/g,'');const i=SEN.findIndex(n=>n.toLowerCase().replace(/[^a-z]/g,'')===norm);if(i>=0&&S.surahs[k])S.surahs[i+1]=true;delete S.surahs[k]}}}else S.surahs={};
  if(!Array.isArray(S.journal))S.journal=[];
  if(!P[S.passion])S.passion='Fashion';
  if(typeof S.name!=='string')S.name='';
  if((S.lang==='ar'||S.lang==='en')&&S.name)$('ob').hidden=true;
}
try{const l=localStorage.getItem('hilal');if(l)merge(JSON.parse(l))}catch(e){}
applyLang();
if(!(S.lang==='ar'||S.lang==='en')){$('ob').hidden=false;$('ob1').hidden=false;$('ob2').hidden=true}
else if(!S.name)showName();
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async([db,user])=>{
    if(!db||!user)return;const id=await user.id();if(!id)return;
    ref=db.collection('data/users/'+id).doc('hilal');
    const snap=await ref.get();const data=snap&&typeof snap.data==='function'?snap.data():snap;
    if(data&&data.days){const keepLang=S.lang,keepName=S.name;merge(data);if(!S.lang)S.lang=keepLang;if(!S.name)S.name=keepName}
    applyLang();if((S.lang==='ar'||S.lang==='en')&&S.name)$('ob').hidden=true;
  }).catch(()=>{});
}
}
