/* VOICE: girly, warm, sisterly; easy Egyptian-flavoured Arabic or friendly English
   IDEA: the Hijri moon; each day you fill your own crescent toward a full moon, month by month to Ramadan
   PICTURE: a large golden moon whose lit part grows with today's good deeds
   COLOUR and TYPE: burgundy dominant, blush support, moon gold accent; Fraunces + DM Sans (EN), Tajawal + Amiri (AR)
   LAYOUT: phone app shell, one column, language choice first, sticky bottom tab bar, six screens */
:root{color-scheme:light dark;
--bg:light-dark(#F7ECEA,#170C11);--card:light-dark(#FFFFFF,#24151C);--soft:light-dark(#F0DCD9,#2E1A23);
--ink:light-dark(#2B1219,#F6E8E6);--muted:light-dark(#6B4A52,#CDB3B8);--line:light-dark(#E6CFCB,#40262F);
--wine:light-dark(#7A1F3A,#E59AAE);--wineBg:light-dark(#7A1F3A,#5A1830);--gold:#D8B46A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:clip}
html[lang=ar] body{font-family:Tajawal,'DM Sans',sans-serif;font-size:17px}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 18px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
html[lang=ar] :is(h1,h2,h3){font-family:Tajawal,sans-serif;font-weight:700}
h1{font-size:32px}h2{font-size:23px}h3{font-size:18px}
p{margin:0}ul{margin:0;padding-inline-start:20px}li{margin:4px 0}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl .ar{font-size:20px;color:var(--wine);font-weight:700}
.ttl h1+.ar{font-size:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 0 8px;gap:12px}
.logo{display:flex;align-items:baseline;gap:8px;font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--wine)}
.logo .ar{font-size:26px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.date{font-size:13px;color:var(--muted);text-align:end}
.date .ar{font-size:15px;color:var(--ink)}
.lang{min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--wine);background:transparent;color:var(--wine);font:600 13px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.intro{padding:6px 2px 4px;display:flex;flex-direction:column;gap:10px}
.intro .hi{font-family:Fraunces,serif;font-size:26px;font-weight:600;color:var(--wine)}
html[lang=ar] .intro .hi{font-family:Tajawal,sans-serif;font-weight:700}
.pillars a{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);color:var(--wine);text-decoration:none;font-weight:600;font-size:14px}
.hero{background:var(--wineBg);color:#FFF4F2;border-radius:28px;padding:22px 20px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:14px;align-items:center}
.hero p{color:#F4D7DC;font-size:15px}.hero h2{color:#fff}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rung{border-radius:14px;padding:10px 4px;text-align:center;background:var(--soft);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rung .ar{font-size:16px;color:var(--ink);font-weight:700}
.rung.now{background:var(--wineBg);color:#F4D7DC}.rung.now .ar{color:#fff}
.rung.done{opacity:.55}
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 2px;border:0;background:none;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--wine);display:grid;place-items:center}
.check[aria-pressed=true] .box{background:var(--wine)}
.check[aria-pressed=true] .box::after{content:"";width:7px;height:12px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed=true] .lbl{color:var(--muted)}
.lbl{display:flex;flex-direction:column;gap:1px}.lbl small{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--wine)}
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pr{min-height:70px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11px 'DM Sans',sans-serif}
.pr .ar{font-size:17px;font-weight:700}
.pr[aria-pressed=true]{background:var(--wineBg);color:#F4D7DC;border-color:var(--wineBg)}.pr[aria-pressed=true] .ar{color:#fff}
.tap{width:200px;height:200px;border-radius:50%;margin:4px auto;border:0;background:radial-gradient(circle at 35% 30%,#9B2F4F,#5A1830);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 18px 40px -18px #5A1830;transition:transform .08s;font:inherit}
.tap:active{transform:scale(.96)}
.tap span{font-family:Fraunces,serif;font-size:54px;line-height:1}
.dhikr{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.dhikr .ar{font-size:26px;line-height:1.8;color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine);border-radius:999px;transition:width .3s}
.btn{min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--wine);background:var(--wine);color:var(--card);font:600 15px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--wine)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 14px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],textarea{font:16px 'DM Sans',Tajawal,sans-serif;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.swb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swb[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.picked{display:flex;align-items:center;gap:12px}
.picked i{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sg{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px}
.sg i{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sg span{display:flex;flex-direction:column;font-size:14px;line-height:1.3}.sg small{color:var(--muted);font-size:12px}
.pal{border-radius:18px;overflow:hidden;background:var(--soft)}
.pal .strip{display:grid;height:56px}
.pal .meta{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.pal .meta small{color:var(--muted)}
.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1.5px dashed var(--wine);border-radius:16px;color:var(--wine);font-weight:600;cursor:pointer}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.lvl{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--soft);border:1.5px solid transparent;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.lvl b.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--wine);font-family:Fraunces,serif}
.lvl[aria-pressed=true]{border-color:var(--wine);background:var(--card)}
.lvl[aria-pressed=true] b.n{background:var(--wine);color:var(--card)}
.lvl .body{display:none;margin-top:6px;font-size:15px;color:var(--muted)}
.lvl[aria-pressed=true] .body{display:block}
.week{border-radius:18px;background:var(--soft);padding:12px 14px}
.week h4{margin:0 0 2px;font:600 15px 'DM Sans',Tajawal,sans-serif;color:var(--wine)}
.wk{border-radius:18px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:6px}
.wk .check{border-bottom:0;min-height:40px;padding:0}
.logo{align-items:center}
.mark{width:34px;height:34px;flex:none;border-radius:9px;box-shadow:0 6px 16px -8px #5A1830}
.mark.big{width:52px;height:52px;border-radius:13px}
.install{border:1.5px dashed var(--gold)}
.ramadan{background:linear-gradient(135deg,#232650,#3B3A78);color:#fff}
.ramadan .ttl h3{color:#fff}.ramadan .note{color:#C9C6EA}.ramadan .muted{color:#D9D6F2}
.ramrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ramn{font-family:Fraunces,serif;font-size:40px;line-height:1;color:var(--gold);font-weight:600}
html[lang=ar] .ramn{font-family:Tajawal,sans-serif;font-weight:700}
.soon{display:flex;flex-direction:column;gap:4px;background:#ffffff14;border:1px dashed var(--gold);border-radius:16px;padding:12px 14px;font-size:15px;color:#ECEAF8}
.soon b{color:var(--gold);font-size:13px}
.sheet{position:fixed;inset:0;z-index:15;background:rgba(20,10,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--bg);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.75,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.lang{display:inline-flex;align-items:center;gap:6px}
.steps{margin:0;padding-inline-start:22px}.steps li{margin:5px 0}
.pinl{display:inline-flex;align-items:center;text-decoration:none}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff40}.dots i.on{background:var(--gold);width:22px;border-radius:4px}
.track{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease}.trk .ti{font-size:26px}.trk b{font-size:16px}.trk small{font-size:12.5px;color:var(--muted);line-height:1.45}.trk[aria-pressed=true]{border-color:var(--wine);background:var(--soft);box-shadow:inset 0 0 0 1px var(--wine)}.trk:active{transform:scale(.97)}
.ilist{display:flex;flex-direction:column;gap:10px;text-align:start}.ilist div{background:#ffffff12;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}.ilist b{color:var(--gold)}.ilist span{color:#D9D6F2}
.slidein{animation:rise .5s cubic-bezier(.2,.75,.2,1)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.ladder button.rung{border:0;font:inherit;cursor:pointer}.rung.cur:not(.now){box-shadow:inset 0 0 0 1.5px var(--wine)}
.mwk{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--soft)}.mwk h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mwk .check{background:transparent}
.mstart{display:flex;flex-direction:column;gap:6px}
.mstart input[type=date]{flex:1;min-width:0;font:16px 'DM Sans',sans-serif;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.mwk.done{background:color-mix(in srgb,var(--gold) 22%,var(--card))}
.mcal{display:flex;flex-direction:column;gap:4px}
.mcw{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);padding:6px 4px 2px;display:block}
.mcw b{color:var(--ink)}.mcw.cur b{color:var(--wine)}.mcw.sel{color:var(--wine)}.mcw.sel b{text-decoration:underline;text-underline-offset:4px}
.mcd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 6px;border-radius:10px;background:var(--soft);font-size:13px}
.mcc small{font-size:9.5px;color:var(--muted)}.mcc b{font-weight:600;line-height:1.1}
.mcc i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6E2B0,#D8B46A);opacity:calc(.15 + .85*var(--f));box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.mcc i.full{box-shadow:0 0 8px #D8B46Acc}
.mcc.fut{background:transparent;border:1px dashed var(--line)}.mcc.fut i{opacity:.12}
.mcc.now{background:var(--wineBg);color:#fff}.mcc.now small{color:#F4D7DC}
.swc{position:relative;display:grid;place-items:center;font-size:18px;color:var(--wine);background:conic-gradient(#e57373,#ffd54f,#81c784,#64b5f6,#ba68c8,#e57373);overflow:hidden;cursor:pointer}
.swc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bslot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.bslot i{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px #0002}.bslot span{display:flex;flex-direction:column;font-weight:600;font-size:14px}.bslot small{font-weight:400;color:var(--muted)}
.bslot[aria-pressed=true]{border-color:var(--wine);background:var(--soft);box-shadow:inset 0 0 0 1px var(--wine)}
.mtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--soft)}
.mtabs button{border:0;background:transparent;border-radius:12px;padding:10px 4px;font:600 14px 'DM Sans',Tajawal,sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.mtabs button[aria-selected=true]{background:var(--card);color:var(--wine);box-shadow:0 1px 4px #3c0a1922}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--wine);color:#fff;font-size:11px;font-weight:700}
.opt .cnt{background:color-mix(in srgb,var(--wine) 15%,transparent);color:var(--wine)}.opt[aria-pressed=true] .cnt{background:#fff3;color:inherit}
.mbody{display:flex;flex-direction:column;gap:10px;animation:rise .3s ease}
.mwks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mwb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 13px 'DM Sans',Tajawal,sans-serif;cursor:pointer}
.mwb small{font-weight:500;font-size:10.5px;color:var(--muted)}.mwb i{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.mwb.cur{border-color:var(--gold)}.mwb.sel{background:var(--wineBg);border-color:var(--wineBg);color:#fff}.mwb.sel small,.mwb.sel i{color:#F4D7DC}
.mgrp{display:flex;flex-direction:column}.mgrp .lkt{margin:6px 0 0}
.mtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:start;cursor:pointer;min-height:112px}
.mtile b{font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.mtile .mgbar{padding:0;width:100%}.mtile small{color:var(--muted);font-size:12px}
.mtile.sel{border-color:var(--wine);background:var(--soft);box-shadow:inset 0 0 0 1px var(--wine)}.mtile.done{border-color:color-mix(in srgb,var(--gold) 70%,transparent)}
.mdet{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:1.5px solid var(--wine);animation:rise .3s ease}
.mdh{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.mdet label{display:flex;flex-direction:column;gap:4px}
.pr .pt{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}
.pr.nx{box-shadow:0 0 0 2px var(--gold)}
.pnext{margin:0;font-size:13.5px;color:var(--wine);font-weight:600}
.ploc{margin:0}.ptab{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.ptr{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}.ptr:first-child{border-top:0}
.ptr.sunr{color:var(--muted);font-size:14px}.ptr.nx{background:var(--soft);color:var(--wine);font-weight:700}
.ntl{display:flex;flex-direction:column}.ntr{display:flex;align-items:center;gap:8px}.ntr .check{flex:1}.ntr input[type=time]{font:15px 'DM Sans',sans-serif;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}.check:disabled{opacity:.5}

const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return rgb2hex([f(0)*255,f(8)*255,f(4)*255])}
const dist=(a,b)=>{const x=hex2rgb(a),y=hex2rgb(b);return Math.hypot(x[0]-y[0],(x[1]-y[1])*1.2,x[2]-y[2])};
const nearest=h=>NAMED.reduce((b,c)=>dist(h,c[2])<dist(h,b[2])?c:b,NAMED[0]);
const cname=h=>{const n=nearest(h);return A()?n[1]:n[0]};
const safeHex=h=>/^#[0-9a-f]{6}$/i.test(h)?h:'#1b1b1b';
function suggestions(base){

  if(s<12)out=[['#7a1f3a',['A rich pop of colour','لمسة لون حلوة']],['#c19a6b',['Warm and soft','دافي وناعم']],['#e8c8c0',['Gentle contrast','تباين لطيف']],[l>50?'#1b1b1b':'#e9dcc3',['Clean and classic','كلاسيك ونضيف']]];
  else out=[[hsl2hex(h,s*.7,l>55?l-28:l+28),['Tonal, same family','من نفس العيلة']],[l>55?'#4a2c20':'#e9dcc3',['Neutral that always works','لون محايد بيمشي مع كل حاجة']],[hsl2hex(h+30,s*.8,l),['A neighbouring shade','درجة قريبة']],[hsl2hex(h+180,Math.min(s,45),Math.max(30,Math.min(70,l))),['Soft contrast','تباين هادي']]];

}

function reveal(el,fresh){
  const items=[...el.querySelectorAll(RV)];
  items.forEach((x,i)=>{x.classList.add('rv');
    if(!fresh){x.classList.add('in','instant');return}
    x.classList.remove('in','instant');x.style.transitionDelay=Math.min(i,4)*80+'ms';
    if(io)io.observe(x);else x.classList.add('in')});
}

const VT={};
function cardTitle(c){if(c.querySelector('#jText'))return'#jText';const t=c.querySelector(':scope>.ttl, :scope>summary');return t?t.textContent.trim():''}
function autoTabs(id){
  const el=$(id);if(!el)return;const defs=VTM.filter(d=>d[0]===id);if(!defs.length)return;
  const blocks=[...el.children].filter(c=>c.matches('.card,details.fold'));
  const groups=[];
  for(const c of blocks){const t=cardTitle(c);const d=defs.find(x=>x[3].includes(t));const g=d?d[1]:'x'+groups.length;let gr=groups.find(x=>x.g===g);
    if(!gr){gr={g,label:d?d[2]:[t,t],els:[],o:d?defs.indexOf(d):99};groups.push(gr)}gr.els.push(c)}
  if(groups.length<2)return;
  groups.sort((a,b)=>a.o-b.o);
  if(!groups.some(x=>x.g===VT[id]))VT[id]=groups[0].g;
  const bar=document.createElement('div');bar.className='vtabs';bar.setAttribute('role','tablist');
  bar.innerHTML=groups.map(x=>`<button type="button" role="tab" data-vtab="${x.g}" aria-selected="${x.g===VT[id]}">${L(x.label)}</button>`).join('');
  blocks[0].before(bar);
  const show=()=>{for(const x of groups)for(const c of x.els){const on=x.g===VT[id];c.classList.toggle('vthide',!on);if(on){c.classList.add('in');if(c.matches('details.fold'))c.open=true}}
    for(const b of bar.children)b.setAttribute('aria-selected',b.dataset.vtab===VT[id]);
    const s=bar.querySelector('[aria-selected=true]');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest',inline:'center'})};
  show();
  bar.addEventListener('click',e=>{const b=e.target.closest('[data-vtab]');if(!b)return;VT[id]=b.dataset.vtab;show();
    const r=bar.getBoundingClientRect();if(r.top<70||r.top>innerHeight*.6)window.scrollTo({top:window.scrollY+r.top-80,behavior:'smooth'})});
}

يوم القيامة.","",0],["اللّهُـمَّ إِنِّـي أَصْبَـحْتُ أُشْـهِدُك ، وَأُشْـهِدُ حَمَلَـةَ عَـرْشِـك ، وَمَلَائِكَتَكَ ، وَجَمـيعَ خَلْـقِك ، أَنَّـكَ أَنْـتَ اللهُ لا إلهَ إلاّ أَنْـتَ وَحْـدَكَ لا شَريكَ لَـك ، وَأَنَّ ُ مُحَمّـداً عَبْـدُكَ وَرَسـولُـك.",4,"من قالها أعتقه الله من النار.","",0],["اللّهُـمَّ ما أَصْبَـحَ بي مِـنْ نِعْـمَةٍ أَو بِأَحَـدٍ مِـنْ خَلْـقِك ، فَمِـنْكَ وَحْـدَكَ لا شريكَ لَـك ، فَلَـكَ الْحَمْـدُ وَلَـكَ الشُّكْـر.",1,"من قالها حين يصبح أدى شكر يومه.","",0],["حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَـيهِ تَوَكَّـلتُ وَهُوَ رَبُّ العَرْشِ العَظـيم.",7,"من قالها كفاه الله ما أهمه من أمر الدنيا والأخرة.","",0],["بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم.",3,"لم يضره من الله شيء.","",0],["اللّهُـمَّ بِكَ أَصْـبَحْنا وَبِكَ أَمْسَـينا ، وَبِكَ نَحْـيا وَبِكَ نَمُـوتُ وَإِلَـيْكَ النُّـشُور.",1,"","",0],["أَصْبَـحْـنا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.",1,"","",0],["سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه ، وَرِضـا نَفْسِـه ، وَزِنَـةَ عَـرْشِـه ، وَمِـدادَ كَلِمـاتِـه.",3,"","",0],["اللّهُـمَّ عافِـني في بَدَنـي ، اللّهُـمَّ عافِـني في سَمْـعي ، اللّهُـمَّ عافِـني في بَصَـري ، لا إلهَ إلاّ أَنْـتَ.",3,"","",0],["اللّهُـمَّ إِنّـي أَعـوذُ بِكَ مِنَ الْكُـفر ، وَالفَـقْر ، وَأَعـوذُ بِكَ مِنْ عَذابِ القَـبْر ، لا إلهَ إلاّ أَنْـتَ.",3,"","",0],["اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في الدُّنْـيا وَالآخِـرَة ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في ديني وَدُنْـيايَ وَأهْـلي وَمالـي ، اللّهُـمَّ اسْتُـرْ عـوْراتي وَآمِـنْ رَوْعاتـي ، اللّهُـمَّ احْفَظْـني مِن بَـينِ يَدَيَّ وَمِن خَلْفـي وَعَن يَمـيني وَعَن شِمـالي ، وَمِن فَوْقـي ، وَأَعـوذُ بِعَظَمَـتِكَ أَن أُغْـتالَ مِن تَحْتـي.",1,"","",0],["يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَـرْفَةَ عَيْنٍ.",3,"","",0],["أَصْبَـحْـنا وَأَصْبَـحْ المُـلكُ للهِ رَبِّ العـالَمـين ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ خَـيْرَ هـذا الـيَوْم ، فَـتْحَهُ ، وَنَصْـرَهُ ، وَنـورَهُ وَبَـرَكَتَـهُ ، وَهُـداهُ ، وَأَعـوذُ بِـكَ مِـنْ شَـرِّ ما فـيهِ وَشَـرِّ ما بَعْـدَه.",1,"","",0],["اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه ، أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت ، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِرْكِهِ ، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم.",1,"","",0],["أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق.",3,"","",0],["اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.",10,"من صلى على حين يصبح وحين يمسى ادركته شفاعتى يوم القيامة.","",0],["اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.",3,"","",0],["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنْ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنْ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.",3,"","",0],["أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.",3,"","",0],["يَا رَبِّ , لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ , وَلِعَظِيمِ سُلْطَانِكَ.",3,"","",0],["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.",1,"","",0],["لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.",100,"كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان.","",0],["سُبْحـانَ اللهِ وَبِحَمْـدِهِ.",100,"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ.","",0],["أسْتَغْفِرُ اللهَ وَأتُوبُ إلَيْهِ",100,"مائة حسنة، ومُحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان حتى يمسى.","",0]],"E":[["أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ\nٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ ﴿٢٥٥﴾",1,"من قالها حين يصبح أجير من الجن حتى يمسي، ومن قالها حين يمسي أجير من الجن حتى يصبح.","البقرة ٢٥٥",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ هُوَ ٱللَّهُ أَحَدٌ ﴿١﴾ ٱللَّهُ ٱلصَّمَدُ ﴿٢﴾ لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ ﴿٣﴾ وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ ﴿٤﴾",3,"","الإخلاص",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ ٱلنَّفَّـٰثَٰتِ فِي ٱلۡعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",3,"","الفلق",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿١﴾ مَلِكِ ٱلنَّاسِ ﴿٢﴾ إِلَٰهِ ٱلنَّاسِ ﴿٣﴾ مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ ﴿٤﴾ ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ ﴿٥﴾ مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ ﴿٦﴾",3,"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء.","الناس",1],["أَمْسَيْـنا وَأَمْسـى المـلكُ لله وَالحَمدُ لله ، لا إلهَ إلاّ اللّهُ وَحدَهُ لا شَريكَ لهُ، لهُ المُـلكُ ولهُ الحَمْـد، وهُوَ على كلّ شَيءٍ قدير ، رَبِّ أسْـأَلُـكَ خَـيرَ ما في هـذهِ اللَّـيْلَةِ وَخَـيرَ ما بَعْـدَهـا ، وَأَعـوذُ بِكَ مِنْ شَـرِّ ما في هـذهِ اللَّـيْلةِ وَشَرِّ ما بَعْـدَهـا ، رَبِّ أَعـوذُبِكَ مِنَ الْكَسَـلِ وَسـوءِ الْكِـبَر ، رَبِّ أَعـوذُ بِكَ مِنْ عَـذابٍ في النّـارِ وَعَـذابٍ في القَـبْر.",1,"","",0],["اللّهـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ ، خَلَقْتَنـي وَأَنا عَبْـدُك ، وَأَنا عَلـى عَهْـدِكَ وَوَعْـدِكَ ما اسْتَـطَعْـت ، أَعـوذُبِكَ مِنْ شَـرِّ ما صَنَـعْت ، أَبـوءُ لَـكَ بِنِعْـمَتِـكَ عَلَـيَّ وَأَبـوءُ بِذَنْـبي فَاغْفـِرْ لي فَإِنَّـهُ لا يَغْـفِرُ الذُّنـوبَ إِلاّ أَنْتَ .",1,"من قالها موقنا بها حين يمسى ومات من ليلته دخل الجنة وكذلك حين يصبح.","",0],["رَضيـتُ بِاللهِ رَبَّـاً وَبِالإسْلامِ ديـناً وَبِمُحَـمَّدٍ صلى الله عليه وسلم نَبِيّـاً.",3,"من قالها حين يصبح وحين يمسى كان حقا على الله أن يرضيه يوم القيامة.","",0],["اللّهُـمَّ إِنِّـي أَمسيتُ أُشْـهِدُك ، وَأُشْـهِدُ حَمَلَـةَ عَـرْشِـك ، وَمَلَائِكَتَكَ ، وَجَمـيعَ خَلْـقِك ، أَنَّـكَ أَنْـتَ اللهُ لا إلهَ إلاّ أَنْـتَ وَحْـدَكَ لا شَريكَ لَـك ، وَأَنَّ ُ مُحَمّـداً عَبْـدُكَ وَرَسـولُـك.",4,"من قالها أعتقه الله من النار.","",0],["اللّهُـمَّ ما أَمسى بي مِـنْ نِعْـمَةٍ أَو بِأَحَـدٍ مِـنْ خَلْـقِك ، فَمِـنْكَ وَحْـدَكَ لا شريكَ لَـك ، فَلَـكَ الْحَمْـدُ وَلَـكَ الشُّكْـر.",1,"من قالها حين يمسى أدى شكر يومه.","",0],["حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَـيهِ تَوَكَّـلتُ وَهُوَ رَبُّ العَرْشِ العَظـيم.",7,"من قالها كفاه الله ما أهمه من أمر الدنيا والأخرة.","",0],["بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم.",3,"لم يضره من الله شيء.","",0],["اللّهُـمَّ بِكَ أَمْسَـينا وَبِكَ أَصْـبَحْنا، وَبِكَ نَحْـيا وَبِكَ نَمُـوتُ وَإِلَـيْكَ الْمَصِيرُ.",1,"","",0],["أَمْسَيْنَا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.",1,"","",0],["سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه ، وَرِضـا نَفْسِـه ، وَزِنَـةَ عَـرْشِـه ، وَمِـدادَ كَلِمـاتِـه.",3,"","",0],["اللّهُـمَّ عافِـني في بَدَنـي ، اللّهُـمَّ عافِـني في سَمْـعي ، اللّهُـمَّ عافِـني في بَصَـري ، لا إلهَ إلاّ أَنْـتَ.",3,"","",0],["اللّهُـمَّ إِنّـي أَعـوذُ بِكَ مِنَ الْكُـفر ، وَالفَـقْر ، وَأَعـوذُ بِكَ مِنْ عَذابِ القَـبْر ، لا إلهَ إلاّ أَنْـتَ.",3,"","",0],["اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في الدُّنْـيا وَالآخِـرَة ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في ديني وَدُنْـيايَ وَأهْـلي وَمالـي ، اللّهُـمَّ اسْتُـرْ عـوْراتي وَآمِـنْ رَوْعاتـي ، اللّهُـمَّ احْفَظْـني مِن بَـينِ يَدَيَّ وَمِن خَلْفـي وَعَن يَمـيني وَعَن شِمـالي ، وَمِن فَوْقـي ، وَأَعـوذُ بِعَظَمَـتِكَ أَن أُغْـتالَ مِن تَحْتـي.",1,"","",0],["يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَـرْفَةَ عَيْنٍ.",3,"","",0],["أَمْسَيْنا وَأَمْسَى الْمُلْكُ للهِ رَبِّ الْعَالَمَيْنِ، اللَّهُمَّ إِنَّي أسْأَلُكَ خَيْرَ هَذَه اللَّيْلَةِ فَتْحَهَا ونَصْرَهَا، ونُوْرَهَا وبَرَكَتهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فيهِا وَشَرَّ مَا بَعْدَهَا.",1,"","",0],["اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه ، أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت ، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِرْكِهِ ، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم.",1,"","",0],["أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق.",3,"","",0],["اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.",10,"من صلى على حين يصبح وحين يمسى ادركته شفاعتى يوم القيامة.","",0],["اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.",3,"","",0],["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنْ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنْ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.",3,"","",0],["أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.",3,"","",0],["يَا رَبِّ , لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ , وَلِعَظِيمِ سُلْطَانِكَ.",3,"","",0],["لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.",100,"كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان.","",0],["اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ ، عَلَيْكَ تَوَكَّلْتُ ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ , مَا شَاءَ اللَّهُ كَانَ ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ , أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا , اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي ، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا ، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.",1,"","",0],["سُبْحـانَ اللهِ وَبِحَمْـدِهِ.",100,"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ.","",0]],"S":[["أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ\nٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ ﴿٢٥٥﴾",1,"من قالها حين يصبح أجير من الجن حتى يمسي، ومن قالها حين يمسي أجير من الجن حتى يصبح.","البقرة ٢٥٥",1],["أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ\nءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيۡهِ مِن رَّبِّهِۦ وَٱلۡمُؤۡمِنُونَۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَـٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيۡنَ أَحَدٖ مِّن رُّسُلِهِۦۚ وَقَالُواْ سَمِعۡنَا وَأَطَعۡنَاۖ غُفۡرَانَكَ رَبَّنَا وَإِلَيۡكَ ٱلۡمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ ٱللَّهُ نَفۡسًا إِلَّا وُسۡعَهَاۚ لَهَا مَا كَسَبَتۡ وَعَلَيۡهَا مَا ٱكۡتَسَبَتۡۗ رَبَّنَا لَا تُؤَاخِذۡنَآ إِن نَّسِينَآ أَوۡ أَخۡطَأۡنَاۚ رَبَّنَا وَلَا تَحۡمِلۡ عَلَيۡنَآ إِصۡرٗا كَمَا حَمَلۡتَهُۥ عَلَى ٱلَّذِينَ مِن قَبۡلِنَاۚ رَبَّنَا وَلَا تُحَمِّلۡنَا مَا لَا طَاقَةَ لَنَا بِهِۦۖ وَٱعۡفُ عَنَّا وَٱغۡفِرۡ لَنَا وَٱرۡحَمۡنَآۚ أَنتَ مَوۡلَىٰنَا فَٱنصُرۡنَا عَلَى ٱلۡقَوۡمِ ٱلۡكَٰفِرِينَ ﴿٢٨٦﴾",1,"من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه.","البقرة ٢٨٥ - ٢٨٦",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ هُوَ ٱللَّهُ أَحَدٌ ﴿١﴾ ٱللَّهُ ٱلصَّمَدُ ﴿٢﴾ لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ ﴿٣﴾ وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ ﴿٤﴾",3,"يجمع كفيه ثم ينفث فيهما ويقرأ، ويمسح بهما ما استطاع من جسده، يبدأ برأسه ووجهه وما أقبل من جسده، ثلاث مرات.","الإخلاص",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ ٱلنَّفَّـٰثَٰتِ فِي ٱلۡعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",3,"","الفلق",1],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿١﴾ مَلِكِ ٱلنَّاسِ ﴿٢﴾ إِلَٰهِ ٱلنَّاسِ ﴿٣﴾ مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ ﴿٤﴾ ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ ﴿٥﴾ مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ ﴿٦﴾",3,"","الناس",1],["بِاسْمِكَ رَبِّـي وَضَعْـتُ جَنْـبي ، وَبِكَ أَرْفَعُـه، فَإِن أَمْسَـكْتَ نَفْسـي فارْحَـمْها ، وَإِنْ أَرْسَلْتَـها فاحْفَظْـها بِمـا تَحْفَـظُ بِه عِبـادَكَ الصّـالِحـين.",1,"","",0],["اللّهُـمَّ إِنَّـكَ خَلَـقْتَ نَفْسـي وَأَنْـتَ تَوَفّـاهـا لَكَ ممَـاتـها وَمَحْـياها ، إِنْ أَحْيَيْـتَها فاحْفَظْـها ، وَإِنْ أَمَتَّـها فَاغْفِـرْ لَـها . اللّهُـمَّ إِنَّـي أَسْـأَلُـكَ العـافِـيَة.",1,"","",0],["اللّهُـمَّ قِنـي عَذابَـكَ يَـوْمَ تَبْـعَثُ عِبـادَك.",3,"","",0],["بِاسْـمِكَ اللّهُـمَّ أَمـوتُ وَأَحْـيا.",1,"","",0],["الـحَمْدُ للهِ الَّذي أَطْـعَمَنا وَسَقـانا، وَكَفـانا، وَآوانا، فَكَـمْ مِمَّـنْ لا كـافِيَ لَـهُ وَلا مُـؤْوي.",1,"","",0],["اللّهُـمَّ عالِـمَ الغَـيبِ وَالشّـهادةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كُـلِّ شَـيءٍ وَمَليـكَه، أَشْهـدُ أَنْ لا إِلـهَ إِلاّ أَنْت، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي، وَمِن شَـرِّ الشَّيْـطانِ وَشِـرْكِه، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم .",1,"","",0],["اللّهُـمَّ أَسْـلَمْتُ نَفْـسي إِلَـيْكَ، وَفَوَّضْـتُ أَمْـري إِلَـيْكَ، وَوَجَّـهْتُ وَجْـهي إِلَـيْكَ، وَأَلْـجَـاْتُ ظَهـري إِلَـيْكَ، رَغْبَـةً وَرَهْـبَةً إِلَـيْكَ، لا مَلْجَـأَ وَلا مَنْـجـا مِنْـكَ إِلاّ إِلَـيْكَ، آمَنْـتُ بِكِتـابِكَ الّـذي أَنْزَلْـتَ وَبِ  قَـدير.",1,"","",0],["لا إلهَ إلاّ اللّهُ وحْـدَهُ لا شريكَ لهُ، لهُ المُلكُ ولهُ الحَمْد، يُحيـي وَيُمـيتُ وهُوَ على كُلّ شيءٍ قدير.",10,"عَشْر مَرّات بَعْدَ المَغْرِب وَالصّـبْح.","",0],["اللّهُـمَّ إِنِّـي أَسْأَلُـكَ عِلْمـاً نافِعـاً وَرِزْقـاً طَيِّـباً ، وَعَمَـلاً مُتَقَـبَّلاً.",1,"بَعْد السّلامِ من صَلاةِ الفَجْر.","",0],["اللَّهُمَّ أَجِرْنِي مِنْ النَّار.",7,"بعد صلاة الصبح والمغرب.","",0],["اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",1,"","",0]]};
const ADS=[['M','☀️',['Morning adhkar','أذكار الصباح']],['E','🌙',['Evening adhkar','أذكار المساء']],['S','😴',['Sleep adhkar','أذكار النوم']],['W','🌤️',['Waking up','أذكار الاستيقاظ']],['P','🕌',['After prayer','أذكار بعد الصلاة']]];
let rdSet='M',rdI=0;
const adN=(set,i,d)=>((d||day()).dh[set+'-'+i]||0);
const adItemDone=(set,i,d)=>adN(set,i,d)>=ADK[set][i][1];
const adDoneCount=(set,d)=>ADK[set].filter((_,i)=>adItemDone(set,i,d)).length;
function adStreak(set){let n=0;const dt=new Date(t0);if(!(day().ad&&day().ad[set]))dt.setDate(dt.getDate()-1);for(let i=0;i<400;i++){const d=S.days[key(dt)];if(d&&d.ad&&d.ad[set]){n++;dt.setDate(dt.getDate()-1)}else break}return n}
function adhkarSetsHTML(){
  const hr=new Date().getHours(),sug=hr>=4&&hr<12?'M':hr>=15&&hr<21?'E':hr>=21||hr<4?'S':null;
  return `<div class="adsets">${ADS.map(([k,ic,nm])=>{const tot=ADK[k].length,dn=adDoneCount(k),full=dn>=tot,st=(k==='M'||k==='E')?adStreak(k):0;
    return `<button type="button" class="adset${full?' full':''}${k===sug?' sug':''}" data-adset="${k}"><span class="adi" aria-hidden="true">${ic}</span><b>${L(nm)}</b><small>${full?L(['Done today ✓','خلصتيها النهارده ✓']):L([`${dn} of ${tot}`,`${toAr(dn)} من ${toAr(tot)}`])}${st?` · 🔥 ${N(st)}`:''}</small><span class="adbar"><i style="width:${dn/tot*100}%"></i></span>${k===sug&&!full?`<em>${L(['Now','وقتها دلوقتي'])}</em>`:''}</button>`}).join('')}</div>`;
}
function openAdhkar(set){
  rdSet=ADK[set]?set:'M';const n=ADK[rdSet].length;rdI=0;for(let i=0;i<n;i++)if(!adItemDone(rdSet,i)){rdI=i;break}
  const sh=$('dsheet');sh.hidden=false;document.body.style.overflow='hidden';drawAd(0);
}
function closeAdhkar(){$('dsheet').hidden=true;document.body.style.overflow='';if(curView()==='deen')renderDeen();renderToday()}
function drawAd(dir){
  const set=ADK[rdSet],nm=ADS.find(x=>x[0]===rdSet),fs=S.adFs>=16&&S.adFs<=36?S.adFs:22;
  const allDone=set.every((_,i)=>adItemDone(rdSet,i));
  $('adTitle').textContent=nm[1]+' '+L(nm[2]);
  $('adSeg').innerHTML=set.map((_,i)=>`<i class="${adItemDone(rdSet,i)?'on':''}${i===rdI&&!allDone?' cur':''}"></i>`).join('');
  const body=$('adBody');
  if(rdI>=set.length){
    const st=(rdSet==='M'||rdSet==='E')?adStreak(rdSet):0;

function onPhoto(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{
    const cx=$('cv').getContext('2d');cx.drawImage(img,0,0,80,80);
    const px=cx.getImageData(28,24,24,48).data;const bk={};
    for(let i=0;i<px.length;i+=4){const k=[px[i]>>4,px[i+1]>>4,px[i+2]>>4].join(',');bk[k]=(bk[k]||0)+1}
    const top=Object.entries(bk).sort((a,b)=>b[1]-a[1])[0][0].split(',').map(v=>v*16+8);
    S.colour=rgb2hex(top);pf='all';genPal=genCombo();
    photoMsg=L([`We found ${cname(S.colour).toLowerCase()} as your main colour and made a combo for you. Tap a swatch if we got it wrong.`,`لقينا إن لونك الأساسي ${cname(S.colour)} وعملنالك تنسيق. لو غلطنا دوسي على اللون الصح.`]);
    URL.revokeObjectURL(url);renderStyle();save();
  };
  img.onerror=()=>{photoMsg=L(['That photo could not be read. Try another, or tap a colour below.','مقدرناش نقرا الصورة دي. جربي واحدة تانية، أو دوسي على لون.']);renderStyle()};
  img.src=url;
}

function genDrive(topic,lvl){
  const X=topic.trim(),q=`«${X}»`;
  const dom=(DDOM.find(d=>d[0].test(X))||[null,null])[1];
  const exp=lvl==='some';
  const W1=[exp?[`List what you already know about ${q} and where your gaps are`,`اكتبي إيه اللي تعرفيه عن ${q} وإيه اللي ناقصك`]:[`Write in one sentence what ${q} means to you and why you want it`,`اكتبي في جملة واحدة ${q} يعني إيه بالنسبالك وليه عايزاه`],[`Find 3 people who are great at ${q} and see how they started`,`دوري على ٣ ناس شاطرين في ${q} وشوفي بدأوا إزاي`],[`Save 5 free resources for ${q}: videos, courses or books`,`احفظي ٥ مصادر مجانية عن ${q}: فيديوهات أو كورسات أو كتب`],['Decide your finish line: one thing you will make or reach in 4 weeks','حددي خط النهاية: حاجة واحدة هتعمليها أو توصليلها في ٤ أسابيع']];
  const W2=[[`3 focused sessions of 25 minutes on ${exp?'the next level of':'the basics of'} ${q}`,`٣ قعدات مركزة، كل واحدة ٢٥ دقيقة، على ${exp?'المستوى اللي بعده في':'أساسيات'} ${q}`],['Write down the 5 most important things you learned','اكتبي أهم ٥ حاجات اتعلمتيها'],['Try a small first practice or exercise','جربي أول تمرين أو تطبيق صغير']];
  const W3=[[exp?`Make something real in ${q} that is bigger than before`:`Make your first small real project in ${q}`,exp?`اعملي حاجة حقيقية في ${q} أكبر من اللي قبلها`:`اعملي أول مشروع حقيقي صغير في ${q}`],['Ask 2 people for honest feedback','اسألي اتنين عن رأيهم بصراحة'],['Improve it using what they said','حسّنيه بناءً على كلامهم']];
  const W4=[['Share what you made: online, with a friend or a mentor','شاركي اللي عملتيه: أونلاين، أو مع صاحبتك، أو مع حد خبرة'],[`Message one person in ${q} with a thoughtful question`,`ابعتي لحد شغال في ${q} سؤال واحد مدروس`],['Write your next 3 steps for your next moon','اكتبي أول ٣ خطوات لقمرك الجاي']];
  if(dom){W1.splice(2,0,dom[0]);W2.splice(1,0,dom[1]);W3.splice(1,0,dom[2]);W4.splice(1,0,dom[3])}
  const T=[['Week 1 · Discover','الأسبوع ١ · اكتشفي'],['Week 2 · Learn','الأسبوع ٢ · اتعلمي'],['Week 3 · Make','الأسبوع ٣ · اعملي'],['Week 4 · Share','الأسبوع ٤ · شاركي']];

/* ---------- journal photos (IndexedDB) and voice typing ---------- */
const IMGDB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('hilal-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('img',mode),st=t.objectStore('img');const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)}));
  return{put:(k,b)=>tx('readwrite',s=>s.put(b,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))}})();
function shrinkImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.78)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
let jImgs=[],jDate=null,recog=null,recOn=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function drawJThumbs(){const el=$('jThumbs');if(!el)return;el.innerHTML=jImgs.map((x,i)=>`<div class="jth"><img src="${x.url}" alt=""><button type="button" class="del" data-jrm="${i}" aria-label="${L(['Remove photo','شيلي الصورة'])}">×</button></div>`).join('')}
function addJPhotos(files){
  const st=$('jPhotoMsg');if(st)st.textContent=L(['Adding…','بنضيف…']);
  Promise.all([...files].slice(0,6).map(f=>shrinkImg(f).then(b=>({blob:b,url:URL.createObjectURL(b)})).catch(()=>null))).then(arr=>{for(const a of arr)if(a&&jImgs.length<6)jImgs.push(a);drawJThumbs();if(st)st.textContent=jImgs.length>=6?L(['Up to 6 photos per entry','لحد ٦ صور في الكتابة الواحدة']):''});
}
let jAuds=[],mrec=null,mrecT=0,mrecTimer=null;
const VL=[['ar-EG',['Egyptian Arabic','عامية مصري']],['ar-SA',['Arabic (Fusha)','عربي فصحى']],['en-GB',['English','English']]];
function vLang(){return VL.some(v=>v[0]===S.vlang)?S.vlang:(A()?'ar-EG':'en-GB')}
function drawJAud(){const el=$('jAuds');if(!el)return;el.innerHTML=jAuds.map((x,i)=>`<div class="jaud"><audio controls src="${x.url}" preload="metadata"></audio><button type="button" class="del" data-jarm="${i}" aria-label="${L(['Remove voice note','شيلي الريكورد'])}">×</button></div>`).join('')}
function toggleRec(){
  const msg=$('jVoiceMsg'),btn=$('jRec');
  if(mrec&&mrec.state==='recording'){mrec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){msg.textContent=L(["Voice notes aren't supported in this browser.",'الريكورد مش مدعوم في المتصفح ده.']);return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    const ch=[];mrec=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);
    mrec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    mrec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(mrecTimer);const bl=new Blob(ch,{type:mrec.mimeType||type||'audio/webm'});if(bl.size&&jAuds.length<5){jAuds.push({blob:bl,url:URL.createObjectURL(bl)});drawJAud()}const b=$('jRec');if(b){b.classList.remove('rec');b.innerHTML='🎤 '+L(['Voice note','ريكورد صوتي'])}msg.textContent=L(['Voice note added. It is saved with your entry exactly as you said it.','الريكورد اتضاف، وهيتحفظ مع كتابتك بصوتك زي ما هو.'])};
    mrec.start();mrecT=0;btn.classList.add('rec');
    const tick=()=>{btn.innerHTML=`⏹ ${L(['Stop','وقفي'])} ${Math.floor(mrecT/60)}:${String(mrecT%60).padStart(2,'0')}`};tick();
    mrecTimer=setInterval(()=>{mrecT++;tick();if(mrecT>=300&&mrec.state==='recording')mrec.stop()},1000);
    msg.textContent=L(['Recording… talk freely. Up to 5 minutes.','بنسجّل… اتكلمي براحتك، لحد ٥ دقايق.']);
  }).catch(()=>{msg.textContent=L(['Please allow the microphone to record a voice note.','اسمحي للمايك عشان تسجّلي.'])});
}
function toggleVoice(){
  const msg=$('jVoiceMsg');
  if(!SR){msg.textContent=L(["Voice typing isn't available in this browser. Tap the microphone on your keyboard instead, it works the same way.",'الكتابة بالصوت مش متاحة في المتصفح ده. دوسي على المايك اللي في الكيبورد بتاعك، وهيعمل نفس الحاجة.']);return}
  if(recOn&&recog){recog.stop();return}
  recog=new SR();recog.lang=vLang();recog.maxAlternatives=1;recog.continuous=true;recog.interimResults=true;
  const ta=$('jText'),base=jDraft?jDraft.replace(/\s*$/,' '):'';let fin='';
  recog.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript.trim()+' ';else interim+=r[0].transcript}jDraft=base+fin+interim;if(ta)ta.value=jDraft};
  recog.onerror=e=>{msg.textContent=e.error==='not-allowed'?L(['Please allow the microphone to use voice typing.','اسمحي للمايك عشان تكتبي بالصوت.']):L(["Couldn't hear you clearly. Try again.",'مسمعناكيش كويس، جربي تاني.'])};
  recog.onend=()=>{recOn=false;jDraft=base+fin;if(ta)ta.value=jDraft;const b=$('jVoice');if(b){b.classList.remove('rec');b.innerHTML='🎙 '+L(['Speak to type','اتكلمي واتكتب'])}if(!msg.textContent.includes('!'))msg.textContent=''};
  try{recog.start();recOn=true;const b=$('jVoice');b.classList.add('rec');b.innerHTML='⏹ '+L(['Listening… tap to stop','بسمعك… دوسي عشان توقفي']);msg.textContent=L(['Speak naturally, your words will appear in the box.','اتكلمي عادي، وكلامك هيظهر في المربع.'])}catch(e){recOn=false}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const ds=b.dataset;let changed=true;
  if(ds.lang){S.lang=ds.lang;applyLang();if(S.storySeen)showName();else showStory()}
  else if(ds.pg){planState().goal=ds.pg;renderHealth()}
  else if(ds.pp){planState().place=ds.pp;renderHealth()}
  else if(ds.pday!==undefined){const p=planState(),d=+ds.pday;if(p.days.includes(d)){if(p.days.length>1)p.days=p.days.filter(x=>x!==d)}else if(p.days.length<6)p.days.push(d);renderHealth()}
  else if(ds.pm){planState().mins=+ds.pm;renderHealth()}
  else if(ds.pd){const p=planState();p.done[ds.pd]=!p.done[ds.pd];renderHealth()}
  else if(ds.cd!==undefined){cDay=+ds.cd;for(const x of document.querySelectorAll('[data-cd]'))x.setAttribute('aria-pressed',+x.dataset.cd===cDay);changed=false}
  else if(b.id==='cAdd'){const t=$('cIn').value.replace(/\s+/g,' ').trim().slice(0,120);if(t){const p=planState();if(!Array.isArray(p.custom[cDay]))p.custom[cDay]=[];p.custom[cDay].push(t);renderHealth()}else changed=false}
  else if(ds.cx){const [d,i]=ds.cx.split('-').map(Number);const p=planState();if(Array.isArray(p.custom[d])){p.custom[d].splice(i,1);renderHealth()}}
  else if(ds.gc){gCat=ds.gc;renderToday();changed=false}
  else if(b.id==='gShare'){S.gShare=S.gShare===false;b.setAttribute('aria-pressed',S.gShare!==false)}
  else if(b.id==='gAdd'){const t=$('gIn').value.replace(/\s+/g,' ').trim().slice(0,120);if(t){const g=newGoal(t,gCat);mg().goals.push(g);mSel=g.id;if(S.gShare!==false)shareGoal(t,gCat);mMsg=L([`Added «${t}» with a 4-week plan. Find it in My goals.`,`اتضاف «${t}» ومعاه خطة ٤ أسابيع. هتلاقيه في أهدافي.`]);renderToday()}else changed=false}
  else if(ds.ms!==undefined){const x=GSUG[+ds.ms];if(x){const g=newGoal(x[1],x[0],x);mg().goals.push(g);mSel=g.id;mMsg=L([`Added «${x[1][0]}» with a 4-week plan. Find it in My goals.`,`اتضاف «${x[1][1]}» ومعاه خطة ٤ أسابيع. هتلاقيه في أهدافي.`]);renderToday()}}
  else if(ds.mtb){mTb=ds.mtb;mMsg='';renderToday();changed=false}

  if(fbUser&&fbUser.emailVerified)return `<div class="card"><h3>${L(['Account','الحساب'])}</h3><p>✓ <b>${esc(fbUser.email)}</b></p><p class="muted">${L(['Your progress is saved to your account and shows on every device you log in to.','تقدّمك محفوظ في حسابك وبيظهر على أي جهاز تسجّلي دخول منه.'])}</p><p class="note" id="acSync">${acSyncErr?'':acSyncText()}</p>${msg}${acSyncErr?`<button class="btn" type="button" id="acRetry">${L(['Try syncing again','جربي المزامنة تاني'])}</button>`:''}<button class="btn ghost" type="button" id="acOut">${L(['Log out','اطلعي من الحساب'])}</button></div>`;
  if(fbUser)return `<div class="card"><h3>${L(['Confirm your email','أكّدي الإيميل'])}</h3><p class="muted">${L([`We sent a confirmation link to ${fbUser.email}. Open it, tap the link, then come back here.`,`بعتنالك لينك تأكيد على ${fbUser.email}. افتحي الإيميل، دوسي على اللينك، وارجعي هنا.`])}</p>${msg}<div class="row"><button class="btn" type="button" id="acCheck">${L(["I've confirmed",'أكّدت ✓'])}</button><button class="btn ghost" type="button" id="acResend">${L(['Send again','ابعتي تاني'])}</button><button class="btn ghost" type="button" id="acOut">${L(['Log out','اطلعي'])}</button></div></div>`;
  return `<div class="card"><h3>${L(['Account','الحساب'])}</h3><p class="muted">${L(['Create a free account to keep your progress on all your devices: phone, iPad and laptop. Optional, Hilal works without it too.','اعملي حساب مجاني عشان حاجتك تبقى على كل أجهزتك: الموبايل والآيباد واللابتوب. اختياري، وهلال شغال من غيره عادي.'])}</p>
   <div class="mtabs" role="tablist">${[['in',['Log in','تسجيل دخول']],['up',['New account','حساب جديد']]].map(t=>`<button type="button" role="tab" data-acm="${t[0]}" aria-selected="${acMode===t[0]}">${L(t[1])}</button>`).join('')}</div>
   <input type="email" id="acEm" autocomplete="email" inputmode="email" placeholder="${L(['Email','الإيميل'])}" value="${esc(acEmail)}" dir="ltr">
   <input type="password" id="acPw" autocomplete="${acMode==='up'?'new-password':'current-password'}" placeholder="${L(['Password (6+ characters)','الباسورد (٦ حروف على الأقل)'])}" dir="ltr">
   ${msg}<button class="btn" type="button" id="acGo"${acBusy?' disabled':''}>${acMode==='up'?L(['Create my account','اعملي الحساب']):L(['Log in','ادخلي'])}</button>
   ${acMode==='in'?`<button class="btn ghost" type="button" id="acReset">${L(['Forgot password?','نسيتي الباسورد؟'])}</button>`:`<p class="note">${L(['We will send you an email to confirm it is you. Your journal text syncs too; voice notes stay on the device they were recorded on.','هنبعتلك إيميل نتأكد إنه إنتي. كتابات يومياتك بتتزامن كمان، والريكوردات بتفضل على الجهاز اللي اتسجلت عليه.'])}</p>`}</div>`;
}
/* ---------- saving ---------- */
let ref=null,timer=null;
function save(){
  S._ts=Date.now();try{localStorage.setItem('hilal',JSON.stringify(S))}catch(e){}
  fbPush();
  if(!ref)return;clearTimeout(timer);
  timer=setTimeout(()=>{ref.set(S).then(()=>{$('saveNote').textContent=L(['Progress saved to your account.','تقدّمك محفوظ في حسابك.'])}).catch(()=>{$('saveNote').textContent=L(['Could not save just now. Your progress is still here on this page.','مقدرناش نحفظ دلوقتي، بس تقدّمك لسه هنا.'])})},700);
}
function merge(x){
  if(!x||typeof x!=='object')return;
  S=Object.assign(S,x);S.colour=safeHex(S.colour);
  if(S.surahs&&typeof S.surahs==='object'){for(const k of Object.keys(S.surahs)){if(!/^\d+$/.test(k)){const norm=k.toLowerCase().replace(/[^a-z]/g,'');const i=SEN.findIndex(n=>n.toLowerCase().replace(/[^a-z]/g,'')===norm);if(i>=0&&S.surahs[k])S.surahs[i+1]=true;delete S.surahs[k]}}}else S.surahs={};
  if(!Array.isArray(S.journal))S.journal=[];
  if(!P[S.passion]&&S.passion!=='custom')S.passion='Fashion';
  if(typeof S.name!=='string')S.name='';
  if((S.lang==='ar'||S.lang==='en')&&S.name&&(S.askName===false||framed()))$('ob').hidden=true;
}
try{const l=localStorage.getItem('hilal');if(l)merge(JSON.parse(l))}catch(e){}
applyLang();
if(!(S.lang==='ar'||S.lang==='en')){$('ob').hidden=false;$('ob1').hidden=false;$('ob2').hidden=true}
else if(!S.storySeen)showStory();
else if(FB_CONFIG&&!S.accSkip)showAccount();
else if(!S.name)showName();
else if(S.askName!==false&&!framed())welcomeBack();
fbInit();
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async([db,user])=>{
    if(!db||!user)return;const id=await user.id();if(!id)return;
    ref=db.collection('data/users/'+id).doc('hilal');
    const snap=await ref.get();const data=snap&&typeof snap.data==='function'?snap.data():snap;
    if(data&&data.days){const keepLang=S.lang,keepName=S.name;merge(data);if(!S.lang)S.lang=keepLang;if(!S.name)S.name=keepName}
    applyLang();
  }).catch(()=>{});
}
}
</script>
